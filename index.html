<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1240">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Princess Sophia and the Noisy Shadow Demon</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script defer src="js/engine/core.js?v=2026.11.06-7"></script>
<script defer src="js/engine/themes.js?v=2026.11.06-7"></script>
<script defer src="js/engine/audio.js?v=2026.11.06-7"></script>
<script defer src="js/engine/fx.js?v=2026.11.06-7"></script>
<script defer src="js/engine/backdrop.js?v=2026.11.06-7"></script>
<script defer src="js/engine/items.js?v=2026.11.06-7"></script>
<script defer src="js/engine/ocarina.js?v=2026.11.06-7"></script>
<!-- Art: shared cast, then scenery per setting -->
<script defer src="js/art/common.js?v=2026.11.06-7"></script>
<script defer src="js/art/ui.js?v=2026.11.06-7"></script>
<script defer src="js/art/kingdom.js?v=2026.11.06-7"></script>
<script defer src="js/art/ocean.js?v=2026.11.06-7"></script>
<script defer src="js/art/sea-friends.js?v=2026.11.06-7"></script>
<script defer src="js/art/treasures.js?v=2026.11.06-7"></script>
<!-- Books: add a new book by adding its file(s) here -->
<script defer src="js/books/sparkle-swords.js?v=2026.11.06-7"></script>
<script defer src="js/books/mermaid-city.story.js?v=2026.11.06-7"></script>
<script defer src="js/books/mermaid-city.js?v=2026.11.06-7"></script>
<!-- Reader boots last -->
<script defer src="js/engine/sketch.js?v=2026.11.06-7"></script>
<script defer src="js/engine/raster.js?v=2026.11.06-7"></script>
<script defer src="js/engine/reader.js?v=2026.11.06-7"></script>
</head>
<body>
<canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="bar">
    <button type="button" class="icon-btn" id="tocBtn" aria-label="Pages" aria-expanded="false" aria-controls="toc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <h1 class="bar-title" id="title">Princess Sophia</h1>
    <button type="button" class="icon-btn bag-btn" id="bagBtn" aria-label="Treasure bag" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5Q4 11 4.5 16.5Q5 21 12 21Q19 21 19.5 16.5Q20 11 15 7.5Z" fill="currentColor"/><path d="M8.5 7.5Q12 9 15.5 7.5" fill="none" stroke="var(--app-bg-1)" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7.2L8 3.5Q12 5 16 3.5L14.5 7.2" fill="currentColor"/><path d="M12 11.5l1.1 2.2 2.4.3-1.8 1.6.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.6 2.4-.3Z" fill="var(--app-bg-1)"/></svg>
      <span class="badge" id="bagCount" hidden>0</span>
    </button>
    <button type="button" class="icon-btn" id="bedtimeBtn" aria-pressed="false" aria-label="Bedtime mode is off. Turn it on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path class="zz" d="M14 4.5h3.5L14 8.5h3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound is on. Turn sound off">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="viewport" id="viewport" aria-roledescription="book"></main>

  <nav class="bar nav" aria-label="Turn the page">
    <button type="button" class="nav-btn" id="prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress">
      <div class="progress-track" id="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1"><div class="progress-fill" id="fill"></div></div>
      <span class="progress-label" id="label">Cover</span>
    </div>
    <button type="button" class="nav-btn" id="next" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>
  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="toc" id="toc" role="dialog" aria-modal="true" aria-labelledby="tocTitle" hidden>
  <div class="toc-grip" aria-hidden="true"></div>
  <div class="toc-head">
    <h2 id="tocTitle">Pages</h2>
    <button type="button" class="icon-btn" id="tocClose" aria-label="Close pages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="toc-books" id="tocBooks" role="tablist" aria-label="Books"></div>
  <ol class="toc-list" id="tocList"></ol>
</aside>

<div class="scrim" id="bagScrim" hidden></div>
<section class="bag-panel" id="bag" role="dialog" aria-modal="true" aria-labelledby="bagTitle" hidden>
  <div class="toc-head">
    <div><h2 id="bagTitle">Treasure Bag</h2><p class="bag-sub" id="bagSub"></p></div>
    <button type="button" class="icon-btn" id="bagClose" aria-label="Close treasure bag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ul class="bag-grid" id="bagGrid"></ul>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>

<noscript><p style="color:#fff;padding:16px">This book needs JavaScript turned on.</p></noscript>
</body>
</html>
