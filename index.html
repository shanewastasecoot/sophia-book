<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Sophia and the Noisy Shadow Demon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Grandstander:wght@600;800;900&display=swap">
<style>
/* Layout: one picture-book spread at a time — illustration on top, read-aloud text below, big arrows to turn pages. Single night-concert look on purpose. */
:root {
  --night: #1b1240;
  --night-2: #2e1a68;
  --paper: #fff8fd;
  --ink: #2a1640;
  --pink: #ff4fa3;
  --gold: #ffc83d;
  --purple: #8a3fd1;
  --orange: #ff7a1a;
  --muted: #7d6a99;
  --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --read: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; }
body {
  background:
    radial-gradient(circle at 12% 18%, #ffffff55 0 1px, transparent 2px) 0 0 / 140px 140px,
    radial-gradient(circle at 70% 60%, #ffffff40 0 1px, transparent 2px) 0 0 / 190px 190px,
    linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--read);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.book {
  width: max(min(100%, 300px), min(100%, 960px, calc((100dvh - 380px) * 1.6)));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.page {
  background: var(--paper);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 0 0 4px #ffffff22, 0 18px 50px #0008, 0 0 60px #ff4fa333;
}
.stage { display: block; width: 100%; aspect-ratio: 8 / 5; max-width: 100%; cursor: pointer; touch-action: pan-y; }
.stage svg { display: block; width: 100%; height: 100%; }
.text {
  padding: 18px clamp(16px, 4vw, 34px) 22px;
  font-size: clamp(1.1rem, 2.4vw, 1.4rem);
  line-height: 1.6;
  min-height: 9em;
}
.text p { margin: 0 0 .5em; max-width: 64ch; }
.text p:last-child { margin-bottom: 0; }
.say { font-family: var(--display); font-weight: 800; color: var(--purple); }
.her { font-family: var(--display); font-weight: 900; color: var(--pink); }
.huge { font-family: var(--display); font-weight: 900; font-size: 1.7em; line-height: 1; color: var(--purple); }
.note { font-style: italic; color: var(--muted); font-size: .88em; }
.dad {
  display: inline-block;
  font: 900 1.12em/1.3 var(--display);
  color: var(--orange);
  transform: rotate(-1.5deg);
}
.whisper { font-size: .72em; letter-spacing: .12em; color: var(--muted); }
.shout {
  font-family: var(--display); font-weight: 900; color: var(--pink);
  font-size: 1.3em; letter-spacing: .02em;
}
.sfx {
  font: 900 1em var(--display);
  color: #fff;
  background: var(--pink);
  border: 0;
  border-radius: 999px;
  padding: .05em .55em .12em;
  margin: 0 .1em;
  cursor: pointer;
  box-shadow: 0 3px 0 #b81f6e;
  transform: rotate(-3deg);
  display: inline-block;
  line-height: 1.3;
}
.sfx:nth-of-type(2n) { background: var(--purple); box-shadow: 0 3px 0 #5a2193; transform: rotate(2deg); }
.sfx:nth-of-type(3n) { background: #ff8a1f; box-shadow: 0 3px 0 #b85a07; transform: rotate(-1deg); }
.sfx.tiny { font-size: .8em; background: #4fb8ff; box-shadow: 0 3px 0 #2373a8; }
.sfx:focus-visible, .nav button:focus-visible, .again:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sfx.go { animation: jiggle .45s ease; }
@keyframes jiggle {
  0% { transform: scale(1) rotate(-3deg); }
  30% { transform: scale(1.35) rotate(6deg); }
  60% { transform: scale(.9) rotate(-6deg); }
  100% { transform: scale(1) rotate(-3deg); }
}
.cover-title {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(1.7rem, 4.6vw, 2.8rem);
  line-height: 1.05; margin: 0 0 .25em; color: var(--purple);
  text-wrap: balance;
}
.cover-title span { color: var(--pink); }
.cover-sub { font-family: var(--display); font-weight: 600; color: #6b4f8f; }
.hint { font-size: .8em; color: var(--muted); }
.again {
  font: 800 1rem var(--display); color: #fff; background: var(--purple);
  border: 0; border-radius: 999px; padding: .5em 1.2em; cursor: pointer;
  box-shadow: 0 4px 0 #5a2193; margin-top: .4em;
}
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav button.arrow {
  width: 64px; height: 64px; border-radius: 50%; border: 0; flex: none;
  background: var(--gold); color: var(--ink); cursor: pointer;
  box-shadow: 0 5px 0 #c08a0a; display: grid; place-items: center;
}
.nav button.arrow:active { transform: translateY(3px); box-shadow: 0 2px 0 #c08a0a; }
.nav button.arrow:disabled { opacity: .3; cursor: default; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; min-width: 0; }
.dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 0; background: #ffffff44; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--pink); transform: scale(1.35); }

/* illustration motion */
.bob, .sway, .wiggle, .shake, .boing, .floaty, .twinkle, .beam { transform-box: fill-box; }
.bob { animation: bob 3s ease-in-out infinite; }
.sway { animation: sway 1.4s ease-in-out infinite; transform-origin: 50% 100%; }
.wiggle { animation: wiggle .5s ease-in-out infinite; transform-origin: 50% 100%; }
.shake { animation: shake .3s linear infinite; transform-origin: 50% 100%; }
.boing { animation: boing .7s ease-in-out infinite; transform-origin: 50% 100%; }
.floaty { animation: floaty 2.6s ease-in-out infinite; }
.twinkle { animation: twinkle 1.6s ease-in-out infinite alternate; transform-origin: center; }
.beam { animation: beam 1.2s linear infinite; }
.burst { transform-box: fill-box; transform-origin: center; animation: burst .7s ease-out forwards; pointer-events: none; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes wiggle { 0%,100% { transform: rotate(-7deg) translateX(-3px); } 50% { transform: rotate(7deg) translateX(3px); } }
@keyframes shake { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-1.5deg) } 75% { transform: rotate(1.5deg) } }
@keyframes boing { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
@keyframes twinkle { from { opacity: .35; transform: scale(.7); } to { opacity: 1; transform: scale(1.15); } }
@keyframes beam { to { stroke-dashoffset: -60; } }
@keyframes burst { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.8) rotate(90deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .bob, .sway, .wiggle, .shake, .boing, .floaty, .twinkle, .beam, .sfx.go { animation: none !important; }
}
@media (max-width: 520px) {
  .nav button.arrow { width: 54px; height: 54px; }
  .text { min-height: 11em; }
}
</style>

<main class="book">
  <article class="page">
    <div class="stage" id="stage"></div>
    <div class="text" id="text" aria-live="polite"></div>
  </article>
  <nav class="nav" aria-label="Turn the page">
    <button class="arrow" id="prev" aria-label="Previous page">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Next page">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</main>

<script>
/* ---------- Characters (change colors here) ---------- */
const SOPHIA = { hair: 'curly', hairC: '#4e2b1a', hairHi: '#7d4e30', skin: '#c49f78', eye: '#6b3f22', dress: '#9b4fe0', dress2: '#ff7ac1', shoe: '#ff4fa3' };
const LUNA   = { hair: 'straight', hairC: '#1e1a3a', hairHi: '#3a3470', skin: '#a8714f', eye: '#3b2418', dress: '#3f6fd8', dress2: '#bcd4ff', shoe: '#2c4fa8', clip: true };
const RUBY   = { hair: 'buns', hairC: '#c4421f', hairHi: '#e46a3a', skin: '#f3d3ba', eye: '#3f7a3a', dress: '#e0314f', dress2: '#ffb340', shoe: '#a81d39' };
const OL = '#3a1d4f';   // outline for princesses and props
const OLG = '#120e3a';  // outline for Grumbo

/* ---------- Drawing helpers ---------- */
const star4 = (x, y, r, fill, cls = '') =>
  `<path class="${cls}" d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${fill}"/>`;
const note = (x, y, size, fill, glyph = '♪') =>
  `<g class="floaty"><text x="${x}" y="${y}" font-size="${size}" fill="${fill}" stroke="${OL}" stroke-width="2" paint-order="stroke" font-family="Segoe UI Symbol, Apple Symbols, sans-serif" font-weight="700">${glyph}</text></g>`;
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

const DEFS = `<defs>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a35"/><stop offset="1" stop-color="#4a2c94"/></linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f5cf0"/><stop offset=".6" stop-color="#c39bff"/><stop offset="1" stop-color="#ffb3dc"/></linearGradient>
  <linearGradient id="skyDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030f"/><stop offset="1" stop-color="#22114a"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c49bff"/><stop offset=".5" stop-color="#ffb3e6"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="gBody" cx=".42" cy=".32" r=".8"><stop offset="0" stop-color="#6676ff"/><stop offset="1" stop-color="#232a96"/></radialGradient>
  <linearGradient id="spotPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></linearGradient>
  <linearGradient id="spotCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ff2ff" stop-opacity=".5"/><stop offset="1" stop-color="#5ff2ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".33" stop-color="#ffc83d"/><stop offset=".66" stop-color="#5ff2ff"/><stop offset="1" stop-color="#b06cff"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`;

function sky(kind) {
  const id = { night: 'skyNight', dusk: 'skyDusk', dark: 'skyDark' }[kind];
  let s = `<rect width="800" height="500" fill="url(#${id})"/>`;
  if (kind !== 'dusk') {
    const r = rng(kind === 'dark' ? 7 : 42);
    for (let i = 0; i < 70; i++) s += `<circle cx="${(r() * 800).toFixed(1)}" cy="${(r() * 330).toFixed(1)}" r="${(r() * 1.6 + .4).toFixed(2)}" fill="#fff" opacity="${(.35 + r() * .65).toFixed(2)}"/>`;
    for (let i = 0; i < 6; i++) s += star4(Math.round(r() * 780 + 10), Math.round(r() * 250 + 10), 6, '#fff6c9', 'twinkle');
  } else {
    s += `<circle cx="660" cy="120" r="46" fill="#fff3b0" opacity=".9"/>`;
    s += `<g fill="#fff" opacity=".85"><ellipse cx="160" cy="90" rx="60" ry="20"/><ellipse cx="200" cy="76" rx="38" ry="22"/><ellipse cx="520" cy="60" rx="50" ry="16"/><ellipse cx="548" cy="48" rx="30" ry="18"/></g>`;
  }
  return s;
}
const moon = (x, y) => `<circle cx="${x}" cy="${y}" r="38" fill="#fff3c4" filter="url(#glow)"/><circle cx="${x + 16}" cy="${y - 10}" r="34" fill="#24165a"/>`;
const ground = (night) => `<g stroke="${night ? '#1c1446' : '#4f8f3e'}" stroke-width="3">
  <path d="M-5 430 Q200 400 400 428 T805 420 L805 505 L-5 505Z" fill="${night ? '#3a2f7a' : '#a6d98a'}"/>
  <path d="M-5 455 Q240 438 470 458 T805 452 L805 505 L-5 505Z" fill="${night ? '#2b2263' : '#86c66e'}"/></g>`;

function castle(x, y, s, night) {
  const wall = night ? '#6a54b8' : '#efd6ff', tower = night ? '#7b63c9' : '#e2c0ff';
  const roof = night ? '#b0407f' : '#ff7ac1', win = night ? '#ffd65a' : '#9fdcff';
  const line = night ? '#2a1d5c' : '#7a4fa0';
  const w = (wx, wy) => `<path d="M${wx} ${wy}v-16a7 7 0 0 1 14 0v16Z" fill="${win}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g stroke="${line}" stroke-width="3.5" stroke-linejoin="round">
    <rect x="-110" y="-140" width="220" height="140" fill="${wall}"/>
    ${[-110, -80, -50, 30, 60, 90].map(cx => `<rect x="${cx}" y="-154" width="20" height="16" fill="${wall}"/>`).join('')}
    <rect x="-150" y="-200" width="60" height="200" fill="${tower}"/>
    <rect x="90" y="-200" width="60" height="200" fill="${tower}"/>
    <rect x="-36" y="-250" width="72" height="250" fill="${tower}"/>
    <path d="M-158 -200 L-120 -268 L-82 -200Z M82 -200 L120 -268 L158 -200Z M-46 -250 L0 -335 L46 -250Z" fill="${roof}"/>
    <path d="M0 -335v-22l18 7-18 7" fill="#ffc83d"/>
    ${w(-127, -150)}${w(113, -150)}${w(-7, -200)}${w(-7, -150)}${w(-80, -90)}${w(66, -90)}
    <path d="M-24 0V-42Q0 -72 24 -42V0Z" fill="${night ? '#3c2a78' : '#9b4fe0'}"/>
  </g></g>`;
}
const shield = (cx, cy, rx, ry, op = 1) =>
  `<g opacity="${op}"><path d="M${cx - rx} ${cy}A${rx} ${ry} 0 0 1 ${cx + rx} ${cy}Z" fill="#ffc83d" opacity=".16"/>
   <path d="M${cx - rx} ${cy}A${rx} ${ry} 0 0 1 ${cx + rx} ${cy}" fill="none" stroke="#ffd65a" stroke-width="5" filter="url(#glow)" class="beam" stroke-dasharray="40 20"/></g>`;
const spot = (x1, x2, grad) => `<path d="M${x1} -10 L${x2 - 70} 500 L${x2 + 70} 500 Z" fill="url(#${grad})"/>`;

/* ---------- Chibi princess: big head, small body. Origin at her feet, about 230 tall at scale 1. ---------- */
const POSES = {
  up:   { L: [-38, -56],  R: [62, -112] },
  sing: { L: [-38, -56],  R: [28, -96], front: true },
  drum: { L: [-34, -50],  R: [34, -50] },
  wave: { L: [-64, -118], R: [64, -118] },
  nose: { L: [-7, -114],  R: [7, -114], front: true },
  hold: { L: [-38, -56],  R: [48, -70] },
};
const ring = (r, angles) => angles.map(a => [Math.round(r * Math.cos(a * Math.PI / 180)), Math.round(-140 - r * Math.sin(a * Math.PI / 180))]);
const CURLS = [...ring(58, [235, 215, 190, 165, 140, 115, 90, 65, 40, 15, -10, -35, -55]), [-72, -140], [72, -140], [-68, -112], [68, -112], [-58, -88], [58, -88]];
const BANGS = [[-34, -178], [-17, -187], [0, -190], [17, -187], [34, -178], [-47, -162], [47, -162]];

function princess(o) {
  const p = Object.assign({ x: 400, y: 450, s: 1, pose: 'up', prop: null, cls: '', hairCls: '' }, o);
  const P = POSES[p.pose];
  const { skin: sk, dress: d, dress2: d2, hairC: h, hairHi: hh } = p;
  const st = `stroke="${OL}" stroke-width="3" stroke-linejoin="round"`;
  let g = '';
  // hair behind the head
  if (p.hair === 'curly') {
    g += `<g class="${p.hairCls}">` + CURLS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="21" fill="${h}" ${st}/>`).join('')
      + CURLS.map(([x, y]) => `<path d="M${x - 8} ${y + 4}q8 -12 16 0" stroke="${hh}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`).join('') + `</g>`;
  } else if (p.hair === 'straight') {
    g += `<path d="M-60 -140Q-63 -206 0 -206Q63 -206 60 -140L66 -78Q0 -66 -66 -78Z" fill="${h}" ${st}/>`;
  } else {
    g += `<circle cx="-48" cy="-190" r="24" fill="${h}" ${st}/><circle cx="48" cy="-190" r="24" fill="${h}" ${st}/>`;
  }
  // stubby legs, puffy skirt
  g += `<rect x="-14" y="-24" width="11" height="22" rx="5" fill="${d2}" ${st}/><rect x="3" y="-24" width="11" height="22" rx="5" fill="${d2}" ${st}/>
    <ellipse cx="-10" cy="-4" rx="12" ry="6.5" fill="${p.shoe}" ${st}/><ellipse cx="10" cy="-4" rx="12" ry="6.5" fill="${p.shoe}" ${st}/>
    <path d="M-20 -74L20 -74Q54 -42 52 -20Q0 -6 -52 -20Q-54 -42 -20 -74Z" fill="${d}" ${st}/>
    <path d="M-52 -20Q0 -6 52 -20L51 -30Q0 -17 -51 -30Z" fill="${d2}"/>
    ${[[-30, -36], [12, -52], [32, -34], [-8, -30], [-14, -58]].map(([x, y]) => star4(x, y, 4.5, '#fff')).join('')}`;
  // arms (outlined), bodice, sleeves
  const arm = (sx, [hx, hy]) => `<path d="M${sx} -80L${hx} ${hy}" stroke="${OL}" stroke-width="13" stroke-linecap="round"/><path d="M${sx} -80L${hx} ${hy}" stroke="${sk}" stroke-width="7.5" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="7.5" fill="${sk}" stroke="${OL}" stroke-width="2.5"/>`;
  g += arm(-14, P.L) + arm(14, P.R);
  g += `<path d="M-16 -92Q0 -96 16 -92L21 -72L-21 -72Z" fill="${d2}" ${st}/>
    <rect x="-22" y="-77" width="44" height="7" rx="3.5" fill="#ffd34d" ${st} stroke-width="2"/><circle cx="0" cy="-73.5" r="3.5" fill="#ff4fa3"/>
    <circle cx="-18" cy="-86" r="9" fill="${d}" ${st}/><circle cx="18" cy="-86" r="9" fill="${d}" ${st}/>
    <circle cx="0" cy="-140" r="52" fill="${sk}" ${st}/>`;
  // face: big shiny chibi eyes
  if (p.pose === 'nose') {
    g += `<path d="M-28 -140l12 7-12 7M28 -140l-12 7 12 7" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-11 -103q5.5 -6 11 0t11 0" stroke="${OL}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  } else {
    for (const ex of [-20, 20]) {
      g += `<ellipse cx="${ex}" cy="-132" rx="10" ry="13" fill="${OL}"/><ellipse cx="${ex}" cy="-128" rx="7.5" ry="8.5" fill="${p.eye}"/>
        <circle cx="${ex + 3.5}" cy="-137" r="4.2" fill="#fff"/><circle cx="${ex - 3.5}" cy="-125" r="2" fill="#fff"/>
        <path d="M${ex + (ex > 0 ? 8 : -8)} -142l${ex > 0 ? 6 : -6} -5" stroke="${OL}" stroke-width="3" stroke-linecap="round"/>`;
    }
    g += p.pose === 'sing'
      ? `<ellipse cx="0" cy="-106" rx="6.5" ry="8.5" fill="#8a1f3d" stroke="${OL}" stroke-width="2.5"/>`
      : `<path d="M-10 -110Q0 -95 10 -110Z" fill="#8a1f3d" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  g += `<ellipse cx="-34" cy="-113" rx="9" ry="5.5" fill="#ff6f9f" opacity=".55"/><ellipse cx="34" cy="-113" rx="9" ry="5.5" fill="#ff6f9f" opacity=".55"/>`;
  // front hair + crown
  let crownY = -194;
  if (p.hair === 'curly') {
    g += `<g class="${p.hairCls}">` + BANGS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="15" fill="${h}" ${st}/><path d="M${x - 6} ${y + 3}q6 -9 12 0" stroke="${hh}" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('') + `</g>`;
    crownY = -212;
  } else {
    g += `<path d="M-54 -146Q-56 -196 0 -196Q56 -196 54 -146Q30 -170 0 -166Q-30 -170 -54 -146Z" fill="${h}" ${st}/>`;
    if (p.clip) g += `<path d="M30 -186a10 10 0 1 0 13 13a8 8 0 1 1 -13 -13Z" fill="#ffd65a" ${st} stroke-width="2"/>`;
    if (p.hair === 'buns') g += `<path d="M-70 -172l-10 10M70 -172l10 10" stroke="#ffd34d" stroke-width="5" stroke-linecap="round"/>`;
  }
  g += crown(0, crownY, 20);
  if (P.front) g += [P.L, P.R].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8" fill="${sk}" stroke="${OL}" stroke-width="2.5"/>`).join('');
  // props

/* ---------- Sounds (made in the browser, no files) ---------- */
let ac;
function A() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(f0, f1, d, type = 'sine', v = .3, t0 = 0, vib = 0) {
  const a = A(), t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
  if (vib) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = vib; lg.gain.value = f0 * .12; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = type === 'sawtooth' ? 900 : 8000;
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, f0, f1, v = .3, t0 = 0, type = 'bandpass') {
  const a = A(), t = a.currentTime + t0, len = Math.floor(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = b; f.type = type; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}
const SOUNDS = {
  boing: () => { tone(180, 720, .1, 'triangle', .35); tone(720, 260, .22, 'triangle', .3, .1); },
  twinkle: () => [1319, 1568, 1976, 2637].forEach((f, i) => tone(f, f, .18, 'sine', .14, i * .07)),
  swish: () => noise(.32, 500, 5000, .5),
  la: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.003, i === 3 ? .5 : .2, 'triangle', .25, i * .16, i === 3 ? 6 : 0)),
  hum: () => { tone(220, 222, 1.2, 'sine', .2); tone(330, 331, 1.2, 'sine', .1); tone(440, 441, 1.2, 'sine', .06); },
  rumble: () => { noise(1.1, 140, 60, .7, 0, 'lowpass'); tone(55, 45, 1.1, 'sine', .3); },
  burp: () => tone(120, 70, .65, 'sawtooth', .45, 0, 22),
  chomp: () => { tone(320, 90, .09, 'square', .2); tone(280, 80, .09, 'square', .2, .12); },
  stomp: () => { tone(130, 38, .35, 'sine', .7); noise(.12, 300, 80, .4, 0, 'lowpass'); },
  roar: () => { tone(170, 85, .9, 'sawtooth', .4, 0, 14); noise(.9, 900, 300, .25); },
  toot: () => tone(96, 70, .75, 'sawtooth', .5, 0, 28),
  boom: () => [0, .22, .33].forEach(t => tone(150, 45, .3, 'sine', .7, t)),
  pop: () => { tone(380, 1400, .07, 'sine', .4); [1568, 2093].forEach((f, i) => tone(f, f, .15, 'sine', .1, .08 + i * .06)); },
  squeak: () => { tone(1500, 2700, .09, 'sine', .25); tone(2700, 1900, .1, 'sine', .22, .09); },
  ding: () => [1760, 1760].forEach((f, i) => tone(f, f * .99, .35, 'sine', .2, i * .22)),
  honk: () => { tone(85, 115, .55, 'sawtooth', .45, 0, 9); noise(.7, 3000, 6000, .2, .6, 'highpass'); },
};

/* ---------- Book controls ---------- */
const stage = document.getElementById('stage'), text = document.getElementById('text');
const prev = document.getElementById('prev'), next = document.getElementById('next'), dots = document.getElementById('dots');
let cur = 0;
PAGES.forEach((_, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-label', i === 0 ? 'Cover' : `Page ${i}`);
  b.onclick = () => go(i); dots.appendChild(b);
});
function go(i) {
  cur = Math.max(0, Math.min(PAGES.length - 1, i));
  const p = PAGES[cur];
  stage.innerHTML = `<svg viewBox="0 0 800 500" role="img" aria-label="${p.alt}">${DEFS}${S[p.scene]()}</svg>`;
  text.innerHTML = p.html;
  prev.disabled = cur === 0; next.disabled = cur === PAGES.length - 1;
  [...dots.children].forEach((d, j) => d.setAttribute('aria-current', j === cur));
  const again = document.getElementById('again'); if (again) again.onclick = () => go(0);
}
prev.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
text.addEventListener('click', e => {
  const b = e.target.closest('.sfx'); if (!b) return;
  try { SOUNDS[b.dataset.snd]?.(); } catch (err) {}
  b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
});
// tap the picture for a sparkle; swipe to turn pages
let sx = null;
stage.addEventListener('pointerdown', e => { sx = e.clientX; });
stage.addEventListener('pointerup', e => {
  const dx = sx === null ? 0 : e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) return go(cur + (dx < 0 ? 1 : -1));
  const svg = stage.querySelector('svg'); if (!svg) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  const colors = ['#ffc83d', '#ff4fa3', '#5ff2ff', '#b06cff', '#fff'];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = star4(Math.round(q.x), Math.round(q.y), 22, colors[Math.floor(Math.random() * colors.length)], 'burst');
  svg.appendChild(g); setTimeout(() => g.remove(), 750);
  try { const f = [1568, 1760, 2093, 2349][Math.floor(Math.random() * 4)]; tone(f, f, .2, 'sine', .12); } catch (err) {}
});
go(0);
